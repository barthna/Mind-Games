<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gamer Profile - Enhanced</title>
    |
    <style>
      body {
        font-family: "Montserrat", sans-serif;
        background: linear-gradient(135deg, #4a00e0, #8406f2);
        color: #e0e0e0;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        background: url("lighter_purple_custom.jpeg") no-repeat center center
          fixed;
      }

      .profile-container {
        /* background-color: rgba(126, 22, 22, 0.8); */
        padding: 90px;
        background: rgba(64, 0, 96, 0.8); /* Dark purple with transparency */
        border-radius: 15px;
        padding: 20px;
        border-radius: 40px;
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.7);
        /* width: 700px; */
        display: flex;
        align-items: flex-start;
        gap: 40px;
        max-width: 700px; /* Adjust as per requirement */
        width: 100%;
        padding: 20px;
        box-sizing: border-box;
      }

      .profile-container h2 {
        text-align: center;
        margin-bottom: 40px;
        color: #ff69b4;
        font-size: 2.5em;
        width: 100%;
      }

      .profile-container .left-section {
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .user-avatar {
        position: relative;
        width: 180px;
        height: 180px;
        border-radius: 50%;
        border: 4px solid #ff69b4;
        background-color: #4a148c;
        overflow: hidden;
      }

      .user-avatar img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 50%;
      }

      .upload-section {
        margin-top: 10px;
        text-align: center;
      }

      .upload-section input {
        display: none;
      }

      .upload-btn {
        background-color: #ff69b4;
        color: white;
        padding: 10px 20px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-size: 1em;
        transition: background-color 0.3s ease;
      }

      .upload-btn:hover {
        background-color: #f06292;
      }

      .profile-details {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 15px;
      }

      .static-info {
        font-weight: bold;
        font-size: 1.2em;
      }

      .profile-container input,
      .profile-container select {
        width: 100%;
        padding: 10px;
        border: 2px solid #673ab7;
        border-radius: 10px;
        background-color: #311b92;
        color: #e0e0e0;
        font-size: 1em;
        max-width: 100%; /* Prevent overflow */
        box-sizing: border-box;
      }

      .profile-container input:disabled,
      .profile-container select:disabled {
        background-color: #444;
        cursor: not-allowed;
      }

      .button-container {
        display: flex;
        justify-content: space-between;
        margin-top: 20px;
      }

      .profile-container button {
        background-color: #ff69b4;
        color: white;
        padding: 10px 20px;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        font-size: 1em;
        transition: background-color 0.3s ease;
      }

      .profile-container button:hover {
        background-color: #f06292;
      }

      .popup {
        position: fixed; /* Keeps the popup in a fixed position */
        top: 10px; /* Positions it near the top of the page */
        left: 50%; /* Centers it horizontally */
        transform: translateX(-50%); /* Ensures perfect centering */
        background: rgba(0, 0, 0, 0.8); /* Semi-transparent background */
        color: white;
        padding: 15px 25px; /* Adjusted padding for better visibility */
        border-radius: 8px; /* Slightly rounded corners */
        display: none; /* Initially hidden */
        z-index: 1000; /* Ensures it stays above other elements */
        font-size: 1.2em;
        box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.2); /* Adds a slight shadow */
      }

      .popup.show {
        display: block;
        animation: fadeIn 0.7s ease-out;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translate(-50%, -55%);
        }
        to {
          opacity: 1;
          transform: translate(-50%, -50%);
        }
      }
    </style>
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="popup" class="popup">Successfully updated details!</div>
    <div class="profile-container">
      <div class="left-section">
        <h2>Gamer Profile</h2>
        <div class="user-avatar">
          <img
            id="avatarPreview"
            src=""
            alt="Profile Picture"
            style="display: none"
          />
        </div>
        <div class="upload-section">
          <label for="avatarUpload" class="upload-btn">Upload Image</label>
          <input type="file" id="avatarUpload" accept="image/*" />
        </div>
      </div>
      <div class="profile-details">
        <div class="static-info">Name: GamerX</div>
        <div class="static-info">Email: gamerx@example.com</div>
        <label for="age">Age:</label>
        <input type="number" id="age" disabled />
        <label for="dob">DOB:</label>
        <input type="text" id="dob" disabled />
        <label for="gender">Gender:</label>
        <select id="gender" disabled>
          <option value="male">Male</option>
          <option value="female">Female</option>
          <option value="other">Other</option>
        </select>
        <label for="phone">Phone Number:</label>
        <input type="text" id="phone" disabled />

        <div class="button-container">
          <button id="edit">Edit</button>
          <button id="save" disabled>Save Changes</button>
        </div>
      </div>
    </div>

    <script>
      const userData = {
        age: 25,
        dob: "15-08-1998",
        gender: "male",
        phone: "9876543210",
      };

      document.getElementById("age").value = userData.age;
      document.getElementById("dob").value = userData.dob;
      document.getElementById("gender").value = userData.gender;
      document.getElementById("phone").value = userData.phone;

      document.getElementById("edit").addEventListener("click", () => {
        document
          .querySelectorAll(".profile-details input, .profile-details select")
          .forEach((el) => {
            el.disabled = false;
          });
        document.getElementById("save").disabled = false;
      });

      document.getElementById("save").addEventListener("click", () => {
        document
          .querySelectorAll(".profile-details input, .profile-details select")
          .forEach((el) => {
            el.disabled = true;
          });
        document.getElementById("save").disabled = true;

        const popup = document.getElementById("popup");
        popup.classList.add("show");
        setTimeout(() => popup.classList.remove("show"), 2000);
      });

      document
        .getElementById("avatarUpload")
        .addEventListener("change", function (event) {
          const file = event.target.files[0];
          if (file) {
            const reader = new FileReader();
            reader.onload = function (e) {
              document.getElementById("avatarPreview").src = e.target.result;
              document.getElementById("avatarPreview").style.display = "block";
            };
            reader.readAsDataURL(file);
          }
        });
    </script>
  </body>
</html>
