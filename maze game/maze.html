<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <title>Maze Game</title>
    <link rel="stylesheet" href="maze.css" />
  </head>
  <body>
    <div id="gradient"></div>
    <div id="page">
      <div id="Message-Container">
        <div id="message">
          <h1>Congratulations!</h1>
          <p>You are done.</p>
          <p id="moves"></p>
          <input
          id="okBtn"
          type="button"
          onclick="makeMaze(); toggleVisablity('Message-Container')"
          value="New Game"
          />
        </div>
      </div>
      <div id="difficultyPopup">
        <div class="popup-content">
          <h2>Select Difficulty</h2>
          <div class="custom-select">
            <select id="diffSelect">
              <option value="10">Easy</option>
              <option value="15">Medium</option>
              <option value="25">Hard</option>
              <option value="38">Extreme</option>
            </select>
          </div>
          <input
              id="newGameBtn"
              type="button"
              onclick="makeMaze(); toggleVisiblity('difficultyPopup')"
              value="New Game"
          />
        </div>
      </div>
      <div id="view">
        <div id="mazeContainer">
          <canvas
            id="mazeCanvas"
            class="border"
            height="1100"
            width="1100"
          ></canvas>
        </div>
      </div>
    </div>
    <script
      type="text/javascript"
      src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.3.1/jquery.min.js"
    ></script>
    <script
      type="text/javascript"
      src="https://cdnjs.cloudflare.com/ajax/libs/jquery.touchswipe/1.6.18/jquery.touchSwipe.min.js"
    ></script>
    <script src="maze.js"></script>
  </body>
</html>
